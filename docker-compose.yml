services:
  signal-cli-rest-api:
    # Keep this current: Signal's servers reject outdated signal-cli clients during
    # linking ("no data to encode"). 0.100 bundles signal-cli 0.14.5. Pin to a digest
    # before real deployment (spec §9).
    image: bbernhard/signal-cli-rest-api:0.100
    environment:
      - MODE=json-rpc
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    networks: [signalnet]
    # NOTE: no published port in normal operation. For the ONE-TIME linking step you
    # may temporarily add:  ports: ["8080:8080"]  — or use `docker compose exec` (below).

  app:
    build: .
    env_file: .env
    depends_on: [signal-cli-rest-api]
    ports:
      - "8090:8090"
    volumes:
      # Persist the encrypted store (SQLCipher DB) + attachment blobs.
      # This dir must exist so the DB can be opened on first boot.
      - ./data:/app/data
    networks: [signalnet]

volumes:
  signal-cli-data:

networks:
  signalnet:
