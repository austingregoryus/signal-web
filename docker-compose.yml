services:
  signal-cli-rest-api:
    # Keep this current: Signal's servers reject outdated signal-cli clients during
    # linking ("no data to encode"). 0.100 bundles signal-cli 0.14.5. Pinned to a
    # digest so a malicious/buggy upstream tag push can't swap the image.
    image: bbernhard/signal-cli-rest-api:0.100@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    restart: unless-stopped
    environment:
      - MODE=json-rpc
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    networks: [signalnet]
    # NOTE: no published port in normal operation. For the ONE-TIME linking step you
    # may temporarily add:  ports: ["8080:8080"]  — or use `docker compose exec` (below).

  app:
    build: .
    env_file: .env
    depends_on: [signal-cli-rest-api]
    restart: unless-stopped
    # Bind to 127.0.0.1 only — the app must NOT be reachable on the public IP;
    # external traffic arrives via the Cloudflare Tunnel (see DEPLOY.md). The
    # host port differs from the container's 8090 to dodge a Windows/WSL quirk
    # (wslrelay collides with Docker's proxy on [::1]); on a Linux VM you can
    # use any free port. To expose publicly, run cloudflared (compose override)
    # proxying to this loopback port.
    ports:
      - "127.0.0.1:8190:8090"
    volumes:
      # Persist the encrypted store (SQLCipher DB) + attachment blobs. The dir
      # is owned by uid 1000 (the non-root `node` user the container runs as).
      - ./data:/app/data
    networks: [signalnet]

volumes:
  signal-cli-data:

networks:
  signalnet:
